{% extends 'portal/base.html' %}

{% block conteudo %}
<h2>Tags</h2>

<a href="{% url 'cadastrar_tag' %}">Cadastrar nova tag</a>

{% for tag in tags %}
    <p>
        {{ tag.nome }}
        <a href="{% url 'atualizar_tag' tag.pk %}">Editar</a>
        <a href="{% url 'excluir_tag' tag.pk %}">Excluir</a>
    </p>
{% empty %}
    <p>Nenhuma tag cadastrada.</p>
{% endfor %}

{% endblock %}
