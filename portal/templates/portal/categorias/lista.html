{% extends 'portal/base.html' %}

{% block conteudo %}

<h2>Categorias</h2>

<a href="{% url 'cadastrar_categoria' %}">Cadastrar categoria</a>

<ul>
    {% for categoria in categorias %}
        <li>
            {{ categoria.nome }}

            <a href="{% url 'atualizar_categoria' categoria.pk %}">Editar</a>
            <a href="{% url 'excluir_categoria' categoria.pk %}">Excluir</a>
        </li>
    {% empty %}
        <li>Nenhuma categoria cadastrada.</li>
    {% endfor %}
</ul>

{% endblock %}
